<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2353" />
      <stop offset="70%" stop-color="#0a0d3a" />
      <stop offset="100%" stop-color="#05071e" />
    </radialGradient>
    <linearGradient id="blurpleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2" />
      <stop offset="100%" stop-color="#7983f5" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f5cbb1" />
      <stop offset="60%" stop-color="#e0a382" />
      <stop offset="100%" stop-color="#be7a5a" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2b38" />
      <stop offset="100%" stop-color="#171520" />
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23272a" />
      <stop offset="100%" stop-color="#121315" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGlow)" stroke="url(#blurpleRim)" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="80" cy="80" r="76" fill="url(#bgGlow)" stroke="#5865f2" stroke-width="3" />

  <!-- Traps & Muscular Shoulders -->
  <path d="M 28 152 C 34 122, 54 110, 80 110 C 106 110, 126 122, 132 152 Z" fill="url(#tankGrad)" stroke="#5865f2" stroke-width="1.5" />
  <!-- Athletic Tank Straps & Chest Cut -->
  <path d="M 52 110 L 60 135 C 72 142, 88 142, 100 135 L 108 110 Z" fill="url(#skinGrad)" />
  <path d="M 60 135 C 72 143, 88 143, 100 135" fill="none" stroke="#5865f2" stroke-width="2" />

  <!-- Muscular Neck -->
  <path d="M 64 88 L 64 115 C 74 120, 86 120, 96 115 L 96 88 Z" fill="url(#skinGrad)" />

  <!-- Jawline and Head -->
  <path d="M 50 68 C 50 96, 62 108, 80 108 C 98 108, 110 96, 110 68 C 110 46, 98 36, 80 36 C 62 36, 50 46, 50 68 Z" fill="url(#skinGrad)" />

  <!-- Short Athletic Beard -->
  <path d="M 52 74 C 54 98, 66 109, 80 109 C 94 109, 106 98, 108 74 C 108 86, 96 103, 80 103 C 64 103, 52 86, 52 74 Z" fill="url(#hairGrad)" opacity="0.9" />
  <path d="M 70 94 C 76 97, 84 97, 90 94" fill="none" stroke="#171520" stroke-width="2" stroke-linecap="round" />

  <!-- Athletic Haircut -->
  <path d="M 47 52 C 48 35, 60 25, 80 25 C 100 25, 112 35, 113 52 C 110 50, 103 46, 90 46 C 75 46, 62 48, 47 52 Z" fill="url(#hairGrad)" />

  <!-- Eyebrows (Focused & Determined) -->
  <path d="M 58 58 L 72 61" stroke="#171520" stroke-width="3" stroke-linecap="round" />
  <path d="M 88 61 L 102 58" stroke="#171520" stroke-width="3" stroke-linecap="round" />

  <!-- Eyes with Blurple Catchlight -->
  <ellipse cx="66" cy="67" rx="4" ry="4.5" fill="#171520" />
  <circle cx="67" cy="65" r="1.5" fill="#ffffff" />
  <circle cx="68" cy="68" r="0.8" fill="#5865f2" />

  <ellipse cx="94" cy="67" rx="4" ry="4.5" fill="#171520" />
  <circle cx="95" cy="65" r="1.5" fill="#ffffff" />
  <circle cx="96" cy="68" r="0.8" fill="#5865f2" />

  <!-- Nose -->
  <path d="M 80 65 L 77 77 L 83 77" fill="none" stroke="#be7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ears with Rim Lighting -->
  <circle cx="48" cy="70" r="6" fill="url(#skinGrad)" stroke="#5865f2" stroke-width="0.8" />
  <circle cx="112" cy="70" r="6" fill="url(#skinGrad)" stroke="#7983f5" stroke-width="0.8" />

  <!-- Barbell Badge Overlay -->
  <g transform="translate(112, 112)">
    <circle cx="14" cy="14" r="14" fill="#5865f2" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 7 14 L 21 14 M 9 10 L 9 18 M 19 10 L 19 18 M 6 12 L 6 16 M 22 12 L 22 16" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
