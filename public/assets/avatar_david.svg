<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowDavid" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f2e2b" />
      <stop offset="70%" stop-color="#0a0d3a" />
      <stop offset="100%" stop-color="#05071e" />
    </radialGradient>
    <linearGradient id="greenRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35ed7e" />
      <stop offset="100%" stop-color="#00b0f4" />
    </linearGradient>
    <linearGradient id="skinGradDavid" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fae2ce" />
      <stop offset="60%" stop-color="#e2ba9b" />
      <stop offset="100%" stop-color="#ba8e6e" />
    </linearGradient>
    <linearGradient id="hairGradDavid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="100%" stop-color="#141721" />
    </linearGradient>
    <filter id="glowDavid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGlowDavid)" stroke="url(#greenRim)" stroke-width="3.5" filter="url(#glowDavid)" />
  <circle cx="80" cy="80" r="76" fill="url(#bgGlowDavid)" stroke="#35ed7e" stroke-width="3" />

  <!-- Shoulders & Hybrid Singlet -->
  <path d="M 30 152 C 36 124, 54 112, 80 112 C 106 112, 124 124, 130 152 Z" fill="#1e2353" stroke="#35ed7e" stroke-width="1.5" />
  <path d="M 52 112 L 60 135 C 72 142, 88 142, 100 135 L 108 112 Z" fill="url(#skinGradDavid)" />
  <!-- Cyan Stripe on Singlet -->
  <path d="M 40 130 L 45 152 M 120 130 L 115 152" stroke="#00b0f4" stroke-width="3" stroke-linecap="round" />

  <!-- Lean Athletic Neck -->
  <path d="M 66 86 L 66 114 C 74 118, 86 118, 94 114 L 94 86 Z" fill="url(#skinGradDavid)" />

  <!-- Jawline and Head -->
  <path d="M 52 66 C 52 94, 63 106, 80 106 C 97 106, 108 94, 108 66 C 108 45, 97 36, 80 36 C 63 36, 52 45, 52 66 Z" fill="url(#skinGradDavid)" />

  <!-- Modern Textured Asian Haircut -->
  <path d="M 49 52 C 48 34, 60 22, 80 22 C 100 22, 112 34, 111 52 C 108 48, 100 42, 80 42 C 60 42, 52 48, 49 52 Z" fill="url(#hairGradDavid)" />
  <path d="M 72 23 C 74 16, 86 16, 88 23" fill="url(#hairGradDavid)" />
  <path d="M 58 28 C 60 20, 68 20, 72 26" fill="url(#hairGradDavid)" />

  <!-- Focused Eyebrows -->
  <path d="M 58 59 L 72 61" stroke="#141721" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 88 61 L 102 59" stroke="#141721" stroke-width="2.8" stroke-linecap="round" />

  <!-- Eyes with Electric Green Catchlight -->
  <ellipse cx="66" cy="67" rx="4" ry="3.8" fill="#141721" />
  <circle cx="67" cy="65.5" r="1.3" fill="#ffffff" />
  <circle cx="68" cy="68" r="0.8" fill="#35ed7e" />

  <ellipse cx="94" cy="67" rx="4" ry="3.8" fill="#141721" />
  <circle cx="95" cy="65.5" r="1.3" fill="#ffffff" />
  <circle cx="96" cy="68" r="0.8" fill="#35ed7e" />

  <!-- Nose -->
  <path d="M 80 64 L 78 75 L 83 75" fill="none" stroke="#ba8e6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Composed Athletic Expression -->
  <path d="M 72 88 C 76 91, 84 91, 88 88" fill="none" stroke="#ba8e6e" stroke-width="2" stroke-linecap="round" />

  <!-- Ears with Green Rim Lighting -->
  <circle cx="50" cy="68" r="5" fill="url(#skinGradDavid)" stroke="#35ed7e" stroke-width="0.8" />
  <circle cx="110" cy="68" r="5" fill="url(#skinGradDavid)" stroke="#00b0f4" stroke-width="0.8" />

  <!-- Hyrox Lightning / Endurance Badge Overlay -->
  <g transform="translate(112, 112)">
    <circle cx="14" cy="14" r="14" fill="#35ed7e" stroke="#000000" stroke-width="1.5" />
    <path d="M 15 6 L 9 15 L 14 15 L 13 22 L 19 13 L 14 13 Z" fill="#000000" />
  </g>
</svg>
