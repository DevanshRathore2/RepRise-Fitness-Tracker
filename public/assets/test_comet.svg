<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="100%" height="100%" fill="none">
  <!-- Standalone Comet Streak and Star vector matching reference image -->
  <defs>
    <linearGradient id="cometGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="cometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <g filter="url(#cometGlow)">
    <!-- Comet Streak & 4-point Star Flare -->
    <path
      d="M 120,40
         L 230,22
         Q 234,16 237,4
         Q 240,16 244,21
         Q 256,22 268,23
         Q 256,26 244,28
         Q 240,36 238,48
         Q 235,35 230,28
         L 120,40 Z"
      fill="url(#cometGrad)"
    />
  </g>
</svg>
